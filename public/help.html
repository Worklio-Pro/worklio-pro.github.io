<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Help Center</title>
  <meta name="description" content="Guides and answers for every part of your account, and a way to contact support.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/help.css?v=6">
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="hc-head"><div class="wrap hc-bar">
    <a href="/" data-link class="hc-brand"><span class="hc-mark" aria-hidden="true">?</span><span><span class="hc-product"></span> Help Center</span></a>
    <!-- on phones this slides out from the right (help.js); on wider screens it sits inline in the header -->
    <div class="hc-panel" id="hcPanel">
      <button type="button" class="hc-close" aria-label="Close menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <nav class="hc-nav" aria-label="Help center">
        <details class="hc-topics"><summary>Browse topics</summary><div class="hc-menu" id="topicMenu"></div></details>
        <a href="/contact" data-link>Contact support</a>
        <a id="appLink" class="hc-app" href="/">Go to app</a>
        <button type="button" class="hc-theme" id="themeBtn" aria-label="Switch light or dark mode" title="Switch light or dark mode"><span class="hc-theme-i" aria-hidden="true">◐</span><span class="hc-theme-l">Light or dark mode</span></button>
        <div class="hc-dtopics"><h2>Browse topics</h2><div id="drawerTopics"></div></div>
      </nav>
    </div>
    <button type="button" class="hc-burger" aria-expanded="false" aria-controls="hcPanel" aria-label="Open menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="hc-scrim" aria-hidden="true"></div>
  </div></header>
  <main id="main" tabindex="-1"></main>
  <footer class="hc-foot"><div class="wrap"><span>© <span id="year"></span> <span class="hc-product"></span></span><span><a href="/" data-link>Help Center home</a> · <a href="/contact" data-link>Contact support</a> · <a href="/terms">Terms of Service</a> · <a href="/privacy">Privacy Policy</a> · <a id="siteLink" href="/">Website</a></span></div></footer>
  <script src="/brand.js?v=1"></script>
  <script src="/help.js?v=5"></script>
  <script src="/chat.js?v=6" data-where="help" defer></script>
</body>
</html>
