<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Worklio Pro</title>
  <link rel="icon" href="/favicon.ico">
  <meta name="color-scheme" content="light dark">
  <script>/* apply the saved theme before first paint; a client's portal link (/client-portal?c=…) is always light */
  if(/^\/client-portal\/?$/.test(location.pathname)&&/[?&]c=/.test(location.search)){document.documentElement.dataset.theme="light";document.querySelector('meta[name="color-scheme"]').content="light"}
  else try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css?v=32">
</head>
<body>
  <div id="app">
    <button id="menuBtn" aria-label="Menu">☰</button>
    <aside id="side"></aside>
    <div id="col">
      <div id="supportBar" class="noprint" role="status" hidden></div>
      <div id="expiryBar" class="noprint" role="status" hidden></div>
      <header id="topbar" class="noprint"></header>
      <main id="main"><p class="muted">Loading…</p></main>
    </div>
  </div>
  <nav id="bnav" class="noprint" aria-label="Main sections"></nav>
  <div id="helpShade" class="noprint" hidden></div>
  <aside id="helpPanel" class="noprint" role="dialog" aria-modal="true" aria-labelledby="helpTitle" aria-hidden="true"></aside>
  <div id="toast"></div>
  <script src="/brand.js?v=1"></script>
  <script src="/app.js?v=39"></script>
  <script src="/pages.js?v=48"></script>
  <script src="/chat.js?v=6" data-where="app" defer></script>
</body>
</html>
