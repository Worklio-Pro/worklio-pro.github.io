<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fieldwork</title>
  <link rel="icon" href="/favicon.ico">
  <meta name="color-scheme" content="light dark">
  <script>/* apply the saved theme before first paint; a client's portal link (/client-portal?c=…) is always light */
  if(/^\/client-portal\/?$/.test(location.pathname)&&/[?&]c=/.test(location.search)){document.documentElement.dataset.theme="light";document.querySelector('meta[name="color-scheme"]').content="light"}
  else try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>
  <div id="app">
    <button id="menuBtn" aria-label="Menu">☰</button>
    <aside id="side"></aside>
    <main id="main"><p class="muted">Loading…</p></main>
  </div>
  <div id="toast"></div>
  <script src="/app.js?v=2"></script>
  <script src="/pages.js?v=2"></script>
</body>
</html>
