    <path d="M70 200l6-14 4 14M110 210l5-16 5 16M160 196l6-12 4 12M190 214l4-14 4 14" stroke="#a16207" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="96" cy="216" r="8" fill="#a16207"/><circle cx="146" cy="222" r="6" fill="#854d0e"/>
    <path d="M90 186V132M90 142l-14-14M90 152l14-16" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
