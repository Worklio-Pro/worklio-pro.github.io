    <path d="M286 182v-48" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="286" cy="124" r="26" fill="#16a34a"/><circle cx="270" cy="138" r="16" fill="#22c55e"/><circle cx="302" cy="138" r="16" fill="#22c55e"/>
    <circle cx="352" cy="200" r="7" fill="#f472b6"/><circle cx="368" cy="206" r="7" fill="#fbbf24"/><circle cx="384" cy="198" r="7" fill="#f472b6"/>
