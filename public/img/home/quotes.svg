  <title id="t">A quote with line items, a client's signature and an Approved stamp, with a deposit paid</title>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f1f3d" flood-opacity=".16"/></filter></defs>
  <rect width="480" height="360" rx="28" fill="#fef3c7"/>
