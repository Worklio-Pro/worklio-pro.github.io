<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">A revenue chart rising month over month with expenses and tax totals</title>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f1f3d" flood-opacity=".16"/></filter></defs>
  <rect width="480" height="360" rx="28" fill="#ffedd5"/>
  <circle cx="70" cy="300" r="80" fill="#fed7aa"/>
  <g filter="url(#sh)"><rect x="40" y="40" width="300" height="250" rx="16" fill="#fff"/></g>
  <text x="62" y="74" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#64748b">Revenue this month</text>
  <text x="62" y="100" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="#0f1f3d">$18,420</text>
  <rect x="190" y="84" width="58" height="20" rx="10" fill="#dcfce7"/><text x="219" y="98" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#15803d">▲ 14%</text>
  <path d="M62 264h258" stroke="#e2e8f0" stroke-width="2"/>
  <g fill="#93c5fd">
    <rect x="70" y="210" width="22" height="54" rx="4"/><rect x="106" y="196" width="22" height="68" rx="4"/><rect x="142" y="204" width="22" height="60" rx="4"/>
    <rect x="178" y="176" width="22" height="88" rx="4"/><rect x="214" y="160" width="22" height="104" rx="4"/><rect x="250" y="142" width="22" height="122" rx="4"/>
  </g>
  <rect x="286" y="120" width="22" height="144" rx="4" fill="#2563eb"/>
  <path d="M81 200L117 186 153 194 189 166 225 150 261 132 297 110" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="297" cy="110" r="6" fill="#f59e0b"/>
  <!-- side cards -->
  <g filter="url(#sh)" font-family="Inter,system-ui,sans-serif">
    <rect x="300" y="190" width="150" height="58" rx="14" fill="#fff"/>
    <text x="318" y="214" font-size="11" fill="#64748b">Expenses</text><text x="318" y="234" font-size="16" font-weight="800" fill="#0f1f3d">$4,105</text>
    <rect x="300" y="262" width="150" height="58" rx="14" fill="#fff"/>
    <text x="318" y="286" font-size="11" fill="#64748b">Sales tax collected</text><text x="318" y="306" font-size="16" font-weight="800" fill="#0f1f3d">$1,268</text>
  </g>
  <g transform="translate(372 60)"><circle cx="30" cy="30" r="30" fill="#f59e0b"/><circle cx="30" cy="30" r="22" fill="#fbbf24"/><text x="30" y="39" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="#b45309">$</text></g>
</svg>
