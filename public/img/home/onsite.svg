<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">A technician at a client's door with a toolbox while the client signs off on a tablet</title>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f1f3d" flood-opacity=".16"/></filter></defs>
  <rect width="480" height="360" rx="28" fill="#ede9fe"/>
  <!-- house front -->
  <rect x="270" y="40" width="190" height="300" fill="#fff7ed"/>
  <rect x="300" y="110" width="84" height="230" rx="6" fill="#7c2d12"/>
  <rect x="312" y="124" width="60" height="70" rx="4" fill="#9a3412"/><rect x="312" y="206" width="60" height="70" rx="4" fill="#9a3412"/>
  <circle cx="370" cy="232" r="5" fill="#fbbf24"/>
  <rect x="404" y="120" width="40" height="56" rx="4" fill="#bfdbfe" stroke="#475569" stroke-width="3"/>
  <rect x="282" y="336" width="120" height="6" fill="#a8a29e"/>
  <rect x="20" y="320" width="440" height="20" fill="#86efac"/>
  <!-- client -->
  <g transform="translate(300 146)">
    <path d="M10 70c0-14 10-24 24-24h12c14 0 24 10 24 24v124H10z" fill="#db2777"/>
    <rect x="12" y="190" width="22" height="20" fill="#1e293b"/><rect x="46" y="190" width="22" height="20" fill="#1e293b"/>
    <rect x="31" y="34" width="18" height="16" fill="#f1c27d"/>
    <circle cx="40" cy="20" r="21" fill="#f1c27d"/>
    <path d="M18 22c-4-22 12-30 24-30s28 8 22 34c-2-12-8-18-22-18s-20 4-24 14z" fill="#451a03"/>
    <circle cx="33" cy="24" r="2.4" fill="#1e293b"/><circle cx="47" cy="24" r="2.4" fill="#1e293b"/>
    <path d="M34 32c4 3 8 3 12 0" stroke="#1e293b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M14 76c-16 18-20 34-6 46" stroke="#db2777" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="8" cy="122" r="7" fill="#f1c27d"/>
  </g>
  <!-- technician -->
  <g transform="translate(120 120)">
    <rect x="22" y="160" width="22" height="58" rx="8" fill="#1e293b"/><rect x="50" y="160" width="22" height="58" rx="8" fill="#1e293b"/>
    <path d="M18 218h28M48 218h28" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <path d="M12 80c0-14 10-24 24-24h22c14 0 24 10 24 24v86H12z" fill="#0d9488"/>
    <path d="M12 112h70" stroke="#fde047" stroke-width="7"/>
    <rect x="38" y="42" width="18" height="16" fill="#8d5524"/>
    <circle cx="47" cy="28" r="22" fill="#8d5524"/>
    <path d="M24 24c0-14 10-22 23-22s23 8 23 22z" fill="#0f766e"/><path d="M60 22h22" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="40" cy="32" r="2.6" fill="#1e293b"/><circle cx="56" cy="32" r="2.6" fill="#1e293b"/>
    <path d="M41 41c4 3 9 3 13 0" stroke="#1e293b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M78 86c18 8 30 18 38 28" stroke="#0d9488" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M16 86c-10 20-12 40-10 62" stroke="#0d9488" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- toolbox -->
    <rect x="-30" y="148" width="66" height="44" rx="6" fill="#dc2626"/><path d="M-12 148v-10h30v10" stroke="#7f1d1d" stroke-width="6" fill="none"/><path d="M-30 164h66" stroke="#7f1d1d" stroke-width="4"/>
  </g>
  <!-- tablet held between them -->
  <g transform="translate(222 200) rotate(-6)" filter="url(#sh)">
    <rect x="0" y="0" width="92" height="70" rx="8" fill="#0f1f3d"/>
    <rect x="6" y="6" width="80" height="58" rx="4" fill="#fff"/>
    <text x="12" y="20" font-family="Inter,system-ui,sans-serif" font-size="8" font-weight="700" fill="#0f1f3d">Job complete</text>
    <path d="M14 46c6-12 10-12 12-4s4 8 9-4 8-8 10 0 6 6 12-2" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M12 54h66" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <circle cx="236" cy="234" r="8" fill="#8d5524"/>
  <!-- speech -->
  <g filter="url(#sh)">
    <rect x="34" y="40" width="168" height="54" rx="14" fill="#fff"/>
    <path d="M150 94l10 16 6-16z" fill="#fff"/>
    <text x="50" y="64" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0f1f3d">All done! Sign here</text>
    <text x="50" y="82" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#64748b">Photos saved to the job</text>
  </g>
</svg>
