<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in</title>
  <link rel="icon" href="/favicon.ico">
  <meta name="color-scheme" content="light dark">
  <script>/* apply the saved theme before first paint */try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css?v=2">
  <style>
    body{background:var(--card)}
    .auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:56px;max-width:1040px;margin:0 auto;padding:40px 24px}
    .auth-form{width:100%;max-width:360px;justify-self:end}
    .auth-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:36px;font-size:24px;font-weight:800;letter-spacing:.02em;color:var(--text);min-height:44px}
    .auth-brand img{height:44px;max-width:140px;object-fit:contain}
    .auth h1{font-size:20px;margin:0 0 6px;text-align:center}
    .auth .lead{color:var(--muted);font-size:14px;text-align:center;margin:0 0 22px}
    /* outlined field with the label sitting on the border */
    .of{position:relative;margin:0 0 16px;color:var(--text)}
    .of span{position:absolute;top:-8px;left:10px;padding:0 4px;background:var(--card);font-size:12px;color:var(--muted);line-height:16px;pointer-events:none}
    .of input{height:50px;padding:0 14px;font-size:15px;margin:0;border-radius:8px}
    .of input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
    .of:focus-within span{color:var(--link)}
    .of .eye{position:absolute;right:6px;top:7px;width:36px;height:36px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
    .of .eye:hover{background:var(--surface-2);color:var(--text)}
    .of.pw input{padding-right:48px}
    .linkish{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--link);cursor:pointer;text-decoration:none}
    .linkish:hover{text-decoration:underline}
    .auth .go{width:100%;height:50px;margin-top:20px;font-size:16px;font-weight:600;border-radius:8px}
    .auth .msg{margin:0 0 16px;padding:10px 12px;border-radius:8px;font-size:14px}
    .msg.err{background:var(--bad-bg);color:var(--bad-fg)}.msg.ok{background:var(--ok-bg);color:var(--ok-fg)}
    .auth .alt{text-align:center;margin-top:28px;font-size:14px;color:var(--muted)}
    .auth-side{justify-self:start;max-width:360px;width:100%}
    .promo{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
    .promo-art{background:linear-gradient(135deg,var(--brand),#0f1f3d);color:#fff;padding:28px 24px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
    .promo-art strong{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
    .promo-art small{opacity:.8;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .promo-body{padding:18px 20px}
    .promo-body h2{font-size:18px;margin:0 0 8px}
    .promo-body ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.7}
    @media (max-width:800px){.auth{grid-template-columns:1fr;gap:32px}.auth-form,.auth-side{justify-self:center}}
  </style>
</head>
<body>
  <main class="auth">
    <section class="auth-form">
      <div class="auth-brand" id="brand"></div>
      <div id="panel" aria-live="polite"><p class="muted" style="text-align:center">Loading…</p></div>
    </section>
    <aside class="auth-side">
      <div class="promo">
        <div class="promo-art"><small id="promoCo">Worklio Pro</small><strong>Everything for your service business, in one place</strong></div>
        <div class="promo-body"><h2>What you can do here</h2>
          <ul><li>Send quotes and collect deposits</li><li>Schedule jobs and assign your team</li><li>Invoice and get paid by card or Zelle</li><li>Text and email clients automatically</li></ul></div>
      </div>
    </aside>
  </main>
  <script src="/login.js?v=2"></script>
</body>
</html>
