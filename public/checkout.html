<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout</title>
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/styles.css?v=2">
  <style>
    body{background:var(--bg)}
    .s-top{max-width:1040px;margin:0 auto;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .s-brand{font-weight:800;font-size:20px;letter-spacing:.01em;color:var(--text);text-decoration:none}
    .steps{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);list-style:none;margin:0;padding:0}
    .steps li{display:flex;align-items:center;gap:6px}.steps li+li::before{content:'';width:18px;height:1px;background:var(--border);margin-right:2px}
    .steps b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;background:var(--ok-bg);color:var(--ok-fg)}
    .steps .now{color:var(--text);font-weight:600}.steps .now b{background:var(--brand);color:#fff}
    .co{max-width:1040px;margin:0 auto;padding:8px 16px 64px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
    .co h1{font-size:clamp(24px,4vw,30px);margin:0 0 4px;letter-spacing:-.01em}.co .lead{color:var(--muted);margin:0 0 20px}
    .co h2{font-size:16px;margin:0 0 12px}
    .card.pad{padding:22px}.co section>.card:last-child,.sum{margin-bottom:0}
    .acct{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}.acct dt{color:var(--muted)}.acct dd{margin:0;overflow-wrap:anywhere}
    .plans{display:grid;gap:10px}
    .opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;margin:0;color:var(--text);font-size:14px}
    .opt:hover{border-color:var(--tint-border)}
    .opt:has(input:checked){border:2px solid var(--brand);padding:13px;background:var(--tint)}
    .opt input{margin-top:3px;accent-color:var(--brand)}
    .opt .nm{font-weight:700;font-size:15px}.opt .ds{color:var(--muted);font-size:13px;margin-top:2px}
    .opt .pr{margin-left:auto;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
    .sum{position:sticky;top:16px}
    .sum .line{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin:0 0 8px}
    .sum .line span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
    .sum .total{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;font-weight:700;font-size:17px}
    .sum ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:5px;font-size:13px;color:var(--muted)}
    .sum li{display:flex;gap:8px}.sum li::before{content:'✓';color:var(--ok);font-weight:700;width:12px;flex-shrink:0}
    .sum details{margin-top:14px;font-size:13px}.sum summary{cursor:pointer;color:var(--link)}
    .pay{width:100%;height:48px;font-size:16px;font-weight:600;margin-top:16px}
    .pay[disabled]{opacity:.7;cursor:progress}
    .fine{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:center;line-height:1.45}
    .msg{padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:14px;line-height:1.45}.msg.err{background:var(--bad-bg);color:var(--bad-fg)}.msg.warn{background:var(--warn-bg);color:var(--warn-fg)}.msg.ok{background:var(--ok-bg);color:var(--ok-fg)}
    .lock{display:inline-flex;align-items:center;gap:6px}
    .done{max-width:520px;margin:40px auto;padding:0 16px;text-align:center}
    @media (max-width:820px){.co{grid-template-columns:1fr}.sum{position:static}.steps{display:none}}
      .period{display:flex;width:max-content;padding:3px;margin:0 0 12px;border:1px solid var(--line);border-radius:99px}
    .period button{border:0;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:6px 16px;border-radius:99px;cursor:pointer}.period button.on{background:var(--brand);color:#fff}
    .pr .sv{display:block;font-size:11px;font-weight:600;color:var(--ok-fg)}
</style>
</head>
<body>
  <header class="s-top"><a class="s-brand" id="brand" href="/pricing"></a>
    <ol class="steps" aria-label="Sign-up progress"><li><b>✓</b>Choose plan</li><li><b>✓</b>Create account</li><li class="now" aria-current="step"><b>3</b>Payment</li></ol></header>
  <main id="main"><p class="muted" style="text-align:center">Loading…</p></main>
  <script src="/checkout.js?v=2"></script>
</body>
</html>
