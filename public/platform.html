<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Platform console</title>
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css?v=2">
  <style>
    body{background:var(--bg)}
    .pf-top{background:var(--side);color:#fff;position:sticky;top:0;z-index:5}
    .pf-bar{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
    .pf-brand{font-weight:800;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
    .pf-brand small{font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7b8db0}
    .pf-tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
    .pf-tabs a{color:#cbd5e1;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;white-space:nowrap}
    .pf-tabs a:hover{background:rgba(255,255,255,.08);color:#fff}.pf-tabs a.on{background:rgba(255,255,255,.14);color:#fff}
    .pf-user{font-size:13px;color:#94a3b8;display:flex;gap:10px;align-items:center}
    .pf-user button{background:none;border:0;color:#cbd5e1;font:inherit;cursor:pointer;padding:4px 8px;border-radius:6px}.pf-user button:hover{background:rgba(255,255,255,.08);color:#fff}
    .pf-main{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
    .pf-main h1{margin:0;font-size:24px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
    .stats .card{margin:0}.stats .l{font-size:13px;color:var(--muted)}.stats .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
    .acc td,.acc th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
    .acc th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
    .acc .nm{font-weight:600}.acc .sm{font-size:13px;color:var(--muted)}
    .inq{padding:12px 0;border-top:1px solid var(--line)}.inq:first-child{border-top:0}.inq-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.inq .sm{font-size:13px;color:var(--muted);margin-top:2px}.inq-m{margin:8px 0 0;white-space:pre-wrap;font-size:14px}
    .pr-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pr-save{font-size:12px;margin:-2px 0 6px}
    .acc select{height:34px;min-width:120px}
    .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
    .pf-chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--neutral-bg);color:var(--neutral-fg)}.pf-chip.ok{background:var(--ok-bg);color:var(--ok-fg)}.pf-chip.wait{background:var(--warn-bg);color:var(--warn-fg)}
    .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    /* plans x features grid */
    .matrix{border-collapse:separate;border-spacing:0;min-width:640px}
    .matrix th,.matrix td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
    .matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:230px;max-width:300px}
    .matrix thead th{vertical-align:top;background:var(--card);min-width:170px}
    .matrix thead input{height:34px;font-size:14px;margin-bottom:6px;text-align:center}
    .matrix thead input.pn{font-weight:700;font-size:15px}
    .matrix thead label{font-size:11px;margin:0 0 2px;text-align:left}
    .matrix .grp td{background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 12px}
    .matrix .grp td:first-child{background:var(--surface-2)}
    .matrix .mx-l{font-weight:600;font-size:14px}.matrix .mx-d{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
    .matrix input[type=checkbox]{width:20px;height:20px;margin:0;cursor:pointer;accent-color:var(--brand)}
    .matrix .always{color:var(--ok);font-weight:700}
    .matrix .count td{font-size:13px;color:var(--muted)}
    .rm-plan{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:2px 4px}.rm-plan:hover{color:var(--danger)}
    .savebar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 18px;margin:0 -18px -18px;display:flex;gap:10px;align-items:center;justify-content:flex-end;border-radius:0 0 12px 12px}
    .savebar .muted{margin-right:auto;font-size:13px}
    .switchline{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);margin:6px 0 14px}
    .note{padding:12px 14px;border-radius:8px;background:var(--info-bg);color:var(--info-fg);font-size:14px;margin-bottom:14px}
    .note code{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:5px}
    .inline-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;max-width:520px}.inline-form label{flex:1;min-width:200px}.inline-form .btn{height:40px;margin-bottom:10px;white-space:nowrap}
    .linkbox{display:flex;gap:8px}.linkbox input{font-size:13px}
    /* modal */
    .pf-ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
    .pf-modal{background:var(--card);border-radius:12px;width:100%;max-width:520px;box-shadow:var(--shadow-lg);padding:20px}
    .pf-modal h2{margin:0 0 14px;font-size:18px}.pf-modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
    .slug{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:4px;background:var(--card)}
    .slug input{border:0;border-radius:0;margin:0!important;min-width:0}.slug span{padding:0 10px;color:var(--muted);font-size:13px;white-space:nowrap;background:var(--surface-2);align-self:stretch;display:flex;align-items:center}
    .hint{font-size:12px;margin-top:4px;min-height:16px}.hint.bad{color:var(--danger)}.hint.good{color:var(--ok)}
    /* login */
    .pf-auth{max-width:380px;margin:12vh auto;padding:0 16px}.pf-auth h1{font-size:22px;margin:0 0 6px;text-align:center}.pf-auth p{text-align:center}
    .pf-auth .btn{width:100%;height:44px;font-size:15px;margin-top:6px}
    .msg{padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}.msg.err{background:var(--bad-bg);color:var(--bad-fg)}
    /* bottom tab bar (phones) */
    .pf-bnav{display:none}
    @media (max-width:760px){
      .pf-tabs{display:none}
      .pf-bar{flex-wrap:nowrap;justify-content:space-between}
      .pf-bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(15,23,42,.06)}
      .pf-bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;border-radius:10px;-webkit-tap-highlight-color:transparent}
      .pf-bnav a.on{color:var(--brand)}
      .pf-bnav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
      #main.pf-main{padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
      .savebar{bottom:calc(66px + env(safe-area-inset-bottom))}
      #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
    }
    @media (max-width:640px){.acc thead{display:none}.acc tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}.acc td{display:block;border:0;padding:4px 0}.acts{justify-content:flex-start}}
  </style>
</head>
<body>
  <div id="root"><p class="muted" style="text-align:center;margin-top:20vh">Loading…</p></div>
  <div id="toast"></div>
  <script src="/platform.js?v=3"></script>
</body>
</html>
